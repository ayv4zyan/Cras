name: Change Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web-and-contracts:
    name: Web, Shared Contracts & Isolation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@4bc3239978280366e02bd97878477f3d4ff403b9 # v2.0.1
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify code formatting
        run: bun run --cwd web format:check

      - name: Lint web client
        run: bun run --cwd web lint

      - name: Typecheck web client & contracts
        run: bun run --cwd web typecheck

      - name: Run web, contract, isolation & accessibility tests
        run: bun run --cwd web test

      - name: Build web production bundle
        run: bun run --cwd web build

  android:
    name: Android Native Client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@94b5068f57377fb459fa780152f63d5b37f63e24 # v4.3.0

      - name: Run Android Lint
        working-directory: android
        run: ./gradlew lint

      - name: Run Android JVM Unit, Contract & Security Tests
        working-directory: android
        run: ./gradlew test

      - name: Assemble Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

  supabase-migrations:
    name: Supabase Local Stack & pgTAP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@053ca266bc3da484ab8d2a677443fb805ad52899 # v1.6.0
        with:
          version: 2.15.5

      - name: Start Supabase stack, test migrations, and run pgTAP security tests
        run: |
          supabase start -x studio,logflare,vector
          supabase db reset
          supabase test db
          supabase stop
